<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Avatar Mascote & Símbolo TikTok - Mestre da Ceia</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@800;900&family=Plus+Jakarta+Sans:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 1024px;
      height: 1024px;
      overflow: hidden;
      background: #020906;
      font-family: 'Outfit', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .avatar-container {
      position: relative;
      width: 1024px;
      height: 1024px;
      background: radial-gradient(circle at 50% 50%, #164E3A 0%, #0A241A 35%, #030E09 70%, #000000 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* TikTok circular frame overlay */
    .outer-circle {
      position: absolute;
      width: 950px;
      height: 950px;
      border-radius: 50%;
      border: 16px solid #F59E0B;
      box-shadow: 
        0 0 70px rgba(245, 158, 11, 0.6),
        inset 0 0 60px rgba(245, 158, 11, 0.4),
        0 0 140px rgba(16, 185, 129, 0.3);
      z-index: 10;
    }

    .fire-glow {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 800px;
      height: 500px;
      background: radial-gradient(ellipse at bottom, rgba(239, 68, 68, 0.45) 0%, rgba(245, 158, 11, 0.25) 50%, transparent 80%);
      filter: blur(50px);
      z-index: 5;
    }

    .mascot-card {
      position: relative;
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .emoji-hero {
      position: relative;
      font-size: 260px;
      line-height: 1;
      filter: drop-shadow(0 20px 40px rgba(0,0,0,0.9)) drop-shadow(0 0 50px rgba(245, 158, 11, 0.5));
      margin-bottom: 20px;
    }

    .santa-crown {
      position: absolute;
      top: -60px;
      right: -30px;
      font-size: 150px;
      transform: rotate(25deg);
      filter: drop-shadow(0 15px 30px rgba(0,0,0,0.9));
    }

    .steak-left {
      position: absolute;
      bottom: -10px;
      left: -90px;
      font-size: 130px;
      transform: rotate(-25deg);
      filter: drop-shadow(0 15px 25px rgba(0,0,0,0.9));
    }

    .tongs-right {
      position: absolute;
      bottom: -10px;
      right: -90px;
      font-size: 130px;
      transform: rotate(25deg);
      filter: drop-shadow(0 15px 25px rgba(0,0,0,0.9));
    }

    .banner-text {
      background: linear-gradient(135deg, #EF4444 0%, #B91C1C 100%);
      border: 4px solid #FEF08A;
      box-shadow: 0 15px 40px rgba(0,0,0,0.8), 0 0 35px rgba(239, 68, 68, 0.7);
      border-radius: 28px;
      padding: 12px 48px;
      margin-top: 10px;
    }

    .banner-title {
      font-size: 64px;
      font-weight: 900;
      color: #FFFFFF;
      letter-spacing: 4px;
      text-shadow: 0 4px 15px rgba(0,0,0,0.9);
      line-height: 1;
    }

    .banner-sub {
      font-size: 32px;
      font-weight: 900;
      color: #FDE047;
      letter-spacing: 6px;
      text-shadow: 0 4px 10px rgba(0,0,0,0.9);
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <div class="avatar-container">
    <div class="outer-circle"></div>
    <div class="fire-glow"></div>

    <!-- Festive Background Stars -->
    <div style="position: absolute; top: 120px; left: 180px; font-size: 60px; color: #FBBF24; text-shadow: 0 0 25px #F59E0B; z-index: 12;">★</div>
    <div style="position: absolute; top: 130px; right: 180px; font-size: 60px; color: #FBBF24; text-shadow: 0 0 25px #F59E0B; z-index: 12;">★</div>
    <div style="position: absolute; bottom: 160px; left: 240px; font-size: 44px; color: #34D399; text-shadow: 0 0 20px #059669; z-index: 12;">✦</div>
    <div style="position: absolute; bottom: 160px; right: 240px; font-size: 44px; color: #34D399; text-shadow: 0 0 20px #059669; z-index: 12;">✦</div>

    <div class="mascot-card">
      <div class="emoji-hero">
        🧔🏻‍♂️
        <div class="santa-crown">🎅</div>
        <div class="steak-left">🥩</div>
        <div class="tongs-right">🔥</div>
      </div>

      <div class="banner-text">
        <div class="banner-title">MESTRE DA CEIA</div>
        <div class="banner-sub">& CHURRASCO</div>
      </div>
    </div>
  </div>
</body>
</html>
