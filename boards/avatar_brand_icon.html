<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Avatar Oficial TikTok - Mestre da Ceia</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@800;900&family=Plus+Jakarta+Sans:wght@700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 1024px;
      height: 1024px;
      overflow: hidden;
      background: #020906;
      font-family: 'Outfit', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .avatar-container {
      position: relative;
      width: 1024px;
      height: 1024px;
      background: radial-gradient(circle at 50% 45%, #0F3426 0%, #061811 45%, #020906 80%, #000000 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Circular glow ring matching TikTok circle cut */
    .glow-ring {
      position: absolute;
      width: 940px;
      height: 940px;
      border-radius: 50%;
      border: 14px solid rgba(245, 158, 11, 0.85);
      box-shadow: 
        0 0 60px rgba(245, 158, 11, 0.45),
        inset 0 0 60px rgba(245, 158, 11, 0.35),
        0 0 120px rgba(16, 185, 129, 0.25);
      z-index: 10;
      pointer-events: none;
    }

    .glow-ring-inner {
      position: absolute;
      width: 900px;
      height: 900px;
      border-radius: 50%;
      border: 3px dashed rgba(254, 240, 138, 0.4);
      z-index: 11;
      pointer-events: none;
    }

    /* Ambient Fire / Bokeh Orbs */
    .orb-1 {
      position: absolute;
      top: 15%;
      left: 20%;
      width: 450px;
      height: 450px;
      background: radial-gradient(circle, rgba(239, 68, 68, 0.28) 0%, transparent 70%);
      filter: blur(50px);
      z-index: 2;
    }
    .orb-2 {
      position: absolute;
      bottom: 15%;
      right: 18%;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(245, 158, 11, 0.25) 0%, transparent 70%);
      filter: blur(60px);
      z-index: 2;
    }
    .orb-3 {
      position: absolute;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(16, 185, 129, 0.22) 0%, transparent 75%);
      filter: blur(70px);
      z-index: 2;
    }

    /* Central Shield / Emblem */
    .emblem-wrapper {
      position: relative;
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 820px;
      height: 820px;
    }

    .badge-pill {
      background: linear-gradient(135deg, #EF4444 0%, #991B1B 100%);
      border: 3px solid #FDE047;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8), 0 0 25px rgba(239, 68, 68, 0.6);
      border-radius: 9999px;
      padding: 10px 32px;
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
      transform: translateY(15px);
    }

    .title-mestre {
      font-size: 104px;
      font-weight: 900;
      letter-spacing: -2px;
      line-height: 0.95;
      text-transform: uppercase;
      background: linear-gradient(180deg, #FFFFFF 0%, #FEF08A 35%, #F59E0B 75%, #B45309 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 14px 28px rgba(0,0,0,0.95)) drop-shadow(0 0 40px rgba(245, 158, 11, 0.6));
      text-align: center;
    }

    .title-sub {
      font-size: 54px;
      font-weight: 900;
      letter-spacing: 6px;
      text-transform: uppercase;
      color: #FFFFFF;
      text-shadow: 0 8px 24px rgba(0,0,0,0.9), 0 0 30px rgba(16, 185, 129, 0.7);
      margin-top: -6px;
      margin-bottom: 24px;
    }

    .subtitle-pill {
      background: rgba(3, 14, 9, 0.85);
      border: 2px solid rgba(245, 158, 11, 0.5);
      box-shadow: 0 10px 25px rgba(0,0,0,0.6);
      border-radius: 9999px;
      padding: 10px 36px;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    /* Santa Hat Decor */
    .santa-hat {
      position: absolute;
      top: -35px;
      right: 175px;
      font-size: 130px;
      transform: rotate(22deg);
      filter: drop-shadow(0 15px 25px rgba(0,0,0,0.9));
      z-index: 35;
      animation: floatHat 3s ease-in-out infinite alternate;
    }

    /* Center 3D Icon Graphic */
    .icon-hero {
      position: relative;
      width: 320px;
      height: 320px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 10px;
      margin-top: -20px;
    }

    .icon-bg {
      position: absolute;
      width: 290px;
      height: 290px;
      border-radius: 65px;
      background: linear-gradient(145deg, #164E3A 0%, #061811 100%);
      border: 5px solid rgba(245, 158, 11, 0.6);
      box-shadow: 
        0 20px 50px rgba(0,0,0,0.9),
        inset 0 0 40px rgba(245, 158, 11, 0.25),
        0 0 60px rgba(16, 185, 129, 0.4);
      transform: rotate(45deg);
    }

    .icon-content {
      position: relative;
      z-index: 25;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body>
  <div class="avatar-container">
    <!-- Outer Glow Rings matching TikTok profile cut -->
    <div class="glow-ring"></div>
    <div class="glow-ring-inner"></div>

    <!-- Glow Orbs -->
    <div class="orb-1"></div>
    <div class="orb-2"></div>
    <div class="orb-3"></div>

    <!-- Sparkles -->
    <div style="position: absolute; top: 120px; left: 240px; font-size: 42px; color: #FDE047; text-shadow: 0 0 20px #F59E0B; z-index: 15;">✦</div>
    <div style="position: absolute; top: 160px; right: 260px; font-size: 56px; color: #FACC15; text-shadow: 0 0 25px #D97706; z-index: 15;">★</div>
    <div style="position: absolute; bottom: 180px; left: 220px; font-size: 38px; color: #34D399; text-shadow: 0 0 20px #059669; z-index: 15;">✦</div>
    <div style="position: absolute; bottom: 200px; right: 230px; font-size: 46px; color: #FDE047; text-shadow: 0 0 20px #F59E0B; z-index: 15;">★</div>

    <!-- Central Emblem -->
    <div class="emblem-wrapper">
      
      <!-- Central Visual Icon -->
      <div class="icon-hero">
        <div class="icon-bg"></div>
        <div class="santa-hat">🎅</div>
        <div class="icon-content">
          <div style="display: flex; align-items: center; justify-content: center; gap: 14px;">
            <span style="font-size: 110px; filter: drop-shadow(0 15px 30px rgba(0,0,0,0.9));">🥩</span>
            <span style="font-size: 110px; filter: drop-shadow(0 15px 30px rgba(0,0,0,0.9));">🍗</span>
          </div>
          <div style="margin-top: -20px; display: flex; align-items: center; gap: 10px;">
            <span style="font-size: 46px; filter: drop-shadow(0 0 15px #EF4444);">🔥</span>
            <span style="font-size: 36px; color: #FDE047; font-weight: 900; letter-spacing: 2px;">CHURRASCO & CEIA</span>
            <span style="font-size: 46px; filter: drop-shadow(0 0 15px #EF4444);">🔥</span>
          </div>
        </div>
      </div>

      <!-- Main Typography (Visible at small sizes) -->
      <div style="position: relative; z-index: 30; text-align: center;">
        <h1 class="title-mestre">MESTRE</h1>
        <h2 class="title-sub">DA CEIA</h2>
      </div>

      <!-- Bottom Status Pill -->
      <div class="subtitle-pill" style="z-index: 30;">
        <span style="color: #FBBF24; font-size: 26px;">⭐⭐⭐⭐⭐</span>
        <span style="color: #E2E8F0; font-size: 24px; font-weight: 800; letter-spacing: 3px; text-transform: uppercase;">APP OFICIAL</span>
        <span style="background: #10B981; color: #022C22; font-size: 18px; font-weight: 900; padding: 4px 14px; border-radius: 9999px;">VERIFICADO</span>
      </div>

    </div>
  </div>
</body>
</html>
