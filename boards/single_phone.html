      flex-direction: column;
      z-index: 10;

    .dynamic-island {

      left: 50%;

      height: 24px;
      background: #000000;
      border-radius: 20px;

      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #0F172A;
      border: 1.5px solid #1E293B;
    }
    .screen-viewport {
      width: 100%;
      height: 100%;
      background: #F8FAFC;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      color: #0F172A;
      position: relative;
